name: Feature request
description: Suggest an idea for FocusRitual
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or awkward today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Fits the project's constraints
      description: FocusRitual is fully offline by design (see README.md).
      options:
        - label: This doesn't require a backend, account system, or network call
          required: true
