name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a Pomodoro session
        2. Lock the phone for 2 minutes
        3. Unlock and observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS (Expo Go)
        - iOS (dev client / native build)
        - Android (Expo Go)
        - Android (dev client / native build)
        - Web
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / OS version
      placeholder: e.g. iPhone 15, iOS 18.1
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Metro/console output, if any. No need to paste unrelated noise.
      render: shell
    validations:
      required: false
